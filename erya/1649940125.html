<!doctype html><html lang="zh-Hans"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>成书时间｜虎思国学网</title><meta name="description" content="《尔雅》成书时间"><link rel="canonical" href="https://husir.cn/erya/1649940125.html"><link rel="stylesheet" href="/site.css?v=20260826g"><link rel="icon" href="/favicon.svg" type="image/svg+xml"><link rel="icon" href="/favicon.ico" sizes="any"><meta name="theme-color" content="#102a43"></head><body><header class="site-header"><a class="brand" href="/" aria-label="虎思国学网首页"><img src="/logo.svg" alt="虎思国学网" width="238" height="54"></a><nav class="main-nav" aria-label="主要栏目"><a href="/">首页</a><a href="/jing/">经</a><a href="/shi/">史</a><a href="/zi/">子</a><a href="/ji/">集</a></nav><nav class="user-nav" aria-label="个人功能"><a href="/bookshelf/">我的书架</a><a href="/account/">登录</a></nav></header><main><div class="reader-shell" data-reader data-work="erya" data-work-title="尔雅" data-title="成书时间"><nav class="breadcrumbs"><a href="/">首页</a><span>›</span><a href="/jing/">经部</a><span>›</span><a href="/erya/">尔雅</a><span>›</span><strong>成书时间</strong></nav><div class="reader-toolbar"><a href="/erya/">☰ 目录</a><button data-font="-2">字小</button><button data-font="2">字大</button><span class="spacer"></span><button class="favorite-button" data-favorite="erya" data-title="尔雅">☆ 收藏</button></div><article class="reader-paper"><h1>成书时间</h1><div class="reader-content"><p>《尔雅》成书于战国或两汉之间，上限不会早于战国，因为书中所用的资料，有的来自《楚辞》、《庄子》、《吕氏春秋》等书，而这些书是战国后的作品。书中谈到的一些动物，如狻猊。据研究，不是战国以前所能见到的。也有认为《尔雅》成书的下限不会晚于西汉，因为在汉文帝时已经设置了《尔雅》博士，到汉武帝时已经出现了犍为文学的《尔雅注》。</p> </div></article><nav class="reader-nav"><a rel="prev" href="/erya/1649940123.html">← 主要内容</a><span></span></nav></div></main><footer class="site-footer"><section class="friend-links" aria-labelledby="friend-title"><h2 id="friend-title">友情链接</h2><div id="friend-links-list"><a href="https://husir.cn/">虎思国学网</a></div></section><div class="footer-meta"><span>公益性传统文化阅读网站</span><span>Copyright ©
