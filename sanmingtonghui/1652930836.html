<!doctype html><html lang="zh-Hans"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>卷七·和｜虎思国学网</title><meta name="description" content="《三命通会》卷七·和"><link rel="canonical" href="https://husir.cn/sanmingtonghui/1652930836.html"><link rel="stylesheet" href="/site.css?v=20260826g"><link rel="icon" href="/favicon.svg" type="image/svg+xml"><link rel="icon" href="/favicon.ico" sizes="any"><meta name="theme-color" content="#102a43"></head><body><header class="site-header"><a class="brand" href="/" aria-label="虎思国学网首页"><img src="/logo.svg" alt="虎思国学网" width="238" height="54"></a><nav class="main-nav" aria-label="主要栏目"><a href="/">首页</a><a href="/jing/">经</a><a href="/shi/">史</a><a href="/zi/">子</a><a href="/ji/">集</a></nav><nav class="user-nav" aria-label="个人功能"><a href="/bookshelf/">我的书架</a><a href="/account/">登录</a></nav></header><main><div class="reader-shell" data-reader data-work="sanmingtonghui" data-work-title="三命通会" data-title="卷七·和"><nav class="breadcrumbs"><a href="/">首页</a><span>›</span><a href="/zi/">子部</a><span>›</span><a href="/sanmingtonghui/">三命通会</a><span>›</span><strong>卷七·和</strong></nav><div class="reader-toolbar"><a href="/sanmingtonghui/">☰ 目录</a><button data-font="-2">字小</button><button data-font="2">字大</button><span class="spacer"></span><button class="favorite-button" data-favorite="sanmingtonghui" data-title="三命通会">☆ 收藏</button></div><article class="reader-paper"><h1>卷七·和</h1><div class="reader-content"> <p>　　和者恬静也。如身柔弱，独有一位夫星，柱无冲破、攻击之神，禀其中和之气，则为和也。如壬辰、辛亥、己卯、己巳，己用甲为夫，亥乃生长之地，得天时地利；甲以辛为官，金生于已，已以金为子，亦生于巳，谓之夫行官星，子得长生，故主益夫旺子。虽自坐卯支为煞，有巳中庚制，为去煞留官之论，女命之贵也。</p> </div></article><nav class="reader-nav"><a rel="prev" href="/sanmingtonghui/1652930846.html">← 卷七·纯</a><a rel="next" href="/sanmingtonghui/1652930825.html">卷七·清 →</a></nav></div></main><footer class="site-footer"><section class="friend-links" aria-labelledby="friend-title"><h2 id="friend-title">友情链接</h2><div id="friend-links-list"><a href="https://h
