<!doctype html><html lang="zh-Hans"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>第一三八则｜虎思国学网</title><meta name="description" content="《围炉夜话》第一三八则"><link rel="canonical" href="https://husir.cn/weiluyehua/1651555138.html"><link rel="stylesheet" href="/site.css?v=20260826g"><link rel="icon" href="/favicon.svg" type="image/svg+xml"><link rel="icon" href="/favicon.ico" sizes="any"><meta name="theme-color" content="#102a43"></head><body><header class="site-header"><a class="brand" href="/" aria-label="虎思国学网首页"><img src="/logo.svg" alt="虎思国学网" width="238" height="54"></a><nav class="main-nav" aria-label="主要栏目"><a href="/">首页</a><a href="/jing/">经</a><a href="/shi/">史</a><a href="/zi/">子</a><a href="/ji/">集</a></nav><nav class="user-nav" aria-label="个人功能"><a href="/bookshelf/">我的书架</a><a href="/account/">登录</a></nav></header><main><div class="reader-shell" data-reader data-work="weiluyehua" data-work-title="围炉夜话" data-title="第一三八则"><nav class="breadcrumbs"><a href="/">首页</a><span>›</span><a href="/zi/">子部</a><span>›</span><a href="/weiluyehua/">围炉夜话</a><span>›</span><strong>第一三八则</strong></nav><div class="reader-toolbar"><a href="/weiluyehua/">☰ 目录</a><button data-font="-2">字小</button><button data-font="2">字大</button><span class="spacer"></span><button class="favorite-button" data-favorite="weiluyehua" data-title="围炉夜话">☆ 收藏</button></div><article class="reader-paper"><h1>第一三八则</h1><div class="reader-content"> <p>　　偶缘为善受累，遂无意为善，是因噎废食也；明识有过当规，却讳言有过，是讳疾忌医也。<br><span style="color:#af9100;">　　偶尔因为做善事受到连累，便不再行善，这就好比曾被食物鲠在喉咙，从此不再进食一般。明明知道有过失应当纠正，却因忌讳而不肯承认，这就如同生病怕人知道而不肯去看医生一样。</span></p> </div></article><nav class="reader-nav"><a rel="prev" href="/weiluyehua/1651555147.html">← 第一三七则</a><a rel="next" href="/weiluyehua/1651555128.html">第一三九则 →</a></nav></div></main><footer class="site-footer"><section class="friend-links" aria-labelledby="friend-title"><h2 id="friend-title">友情链接</h2><div id="friend-links-list"><a href="https:/
