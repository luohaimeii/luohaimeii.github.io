<!doctype html><html lang="zh-Hans"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>卷二十七 卷中·？？｜虎思国学网</title><meta name="description" content="《食疗本草》卷中·？？"><link rel="canonical" href="https://husir.cn/shiliaobencao/1652761839.html"><link rel="stylesheet" href="/site.css?v=20260826g"><link rel="icon" href="/favicon.svg" type="image/svg+xml"><link rel="icon" href="/favicon.ico" sizes="any"><meta name="theme-color" content="#102a43"></head><body><header class="site-header"><a class="brand" href="/" aria-label="虎思国学网首页"><img src="/logo.svg" alt="虎思国学网" width="238" height="54"></a><nav class="main-nav" aria-label="主要栏目"><a href="/">首页</a><a href="/jing/">经</a><a href="/shi/">史</a><a href="/zi/">子</a><a href="/ji/">集</a></nav><nav class="user-nav" aria-label="个人功能"><a href="/bookshelf/">我的书架</a><a href="/account/">登录</a></nav></header><main><div class="reader-shell" data-reader data-work="shiliaobencao" data-work-title="食疗本草" data-title="卷二十七 卷中·？？"><nav class="breadcrumbs"><a href="/">首页</a><span>›</span><a href="/zi/">子部</a><span>›</span><a href="/shiliaobencao/">食疗本草</a><span>›</span><strong>卷二十七 卷中·？？</strong></nav><div class="reader-toolbar"><a href="/shiliaobencao/">☰ 目录</a><button data-font="-2">字小</button><button data-font="2">字大</button><span class="spacer"></span><button class="favorite-button" data-favorite="shiliaobencao" data-title="食疗本草">☆ 收藏</button></div><article class="reader-paper"><h1>卷二十七 卷中·？？</h1><div class="reader-content"> <p>　　（一）肉∶平，味酸。〔证〕</p> <p>　　主服丹石劳热。患赤白痢多时不瘥者，可煮肉经宿露中，明日空腹和酱食之一顿，即瘥。〔嘉〕</p> <p>　　（二）又，瘦人可和五味煮食，令人长脂肉肥白。曾服丹石，可时时服之。丹石恶发热，服之妙。〔嘉〕</p> <p>　　（三）骨∶主上气咳嗽，炙末。酒和三合服之。日二，其嗽必瘥。〔证〕</p> </div></article><nav class="reader-nav"><a rel="prev" href="/shiliaobencao/1652761849.html">← 卷二十六 卷中·獭</a><a rel="next" href="/shiliaobencao/1652761828.html">卷二十八 卷中·野猪 →</a></nav></div></main><footer class="site-footer"><section class="friend-links" aria-labelledby="friend-title"><h2 id="friend-title">友情链接
