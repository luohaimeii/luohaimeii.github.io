<!doctype html><html lang="zh-Hans"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>卷三·行针指要歌｜虎思国学网</title><meta name="description" content="《针灸大成》卷三·行针指要歌"><link rel="canonical" href="https://husir.cn/zhenjiudacheng/1652756323.html"><link rel="stylesheet" href="/site.css?v=20260826g"><link rel="icon" href="/favicon.svg" type="image/svg+xml"><link rel="icon" href="/favicon.ico" sizes="any"><meta name="theme-color" content="#102a43"></head><body><header class="site-header"><a class="brand" href="/" aria-label="虎思国学网首页"><img src="/logo.svg" alt="虎思国学网" width="238" height="54"></a><nav class="main-nav" aria-label="主要栏目"><a href="/">首页</a><a href="/jing/">经</a><a href="/shi/">史</a><a href="/zi/">子</a><a href="/ji/">集</a></nav><nav class="user-nav" aria-label="个人功能"><a href="/bookshelf/">我的书架</a><a href="/account/">登录</a></nav></header><main><div class="reader-shell" data-reader data-work="zhenjiudacheng" data-work-title="针灸大成" data-title="卷三·行针指要歌"><nav class="breadcrumbs"><a href="/">首页</a><span>›</span><a href="/zi/">子部</a><span>›</span><a href="/zhenjiudacheng/">针灸大成</a><span>›</span><strong>卷三·行针指要歌</strong></nav><div class="reader-toolbar"><a href="/zhenjiudacheng/">☰ 目录</a><button data-font="-2">字小</button><button data-font="2">字大</button><span class="spacer"></span><button class="favorite-button" data-favorite="zhenjiudacheng" data-title="针灸大成">☆ 收藏</button></div><article class="reader-paper"><h1>卷三·行针指要歌</h1><div class="reader-content"> <p>　　或针风，先向风府百会中。或针水，水分侠脐上边取。</p> <p>　　或针结，针着大肠泄水穴。或针劳，须向膏肓及百劳。</p> <p>　　或针虚，气海丹田委中奇。或针气，膻中一穴分明记。</p> <p>　　或针嗽，肺俞风门须用灸。或针痰，先针中脘三里间。</p> <p>　　或针吐，中脘气海膻中补。翻胃吐食一般医，针中有妙少人知。</p> </div></article><nav class="reader-nav"><a rel="prev" href="/zhenjiudacheng/1652756333.html">← 卷三·行针总要歌</a><a rel="next" href="/zhenjiudacheng/1652756312.html">卷三·刺法启玄歌（六言） →</a></nav></div></main><footer class="site-footer"><section class="friend-links" aria-labelledby="friend-title"><h2 id="friend-title">
