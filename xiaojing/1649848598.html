<!doctype html><html lang="zh-Hans"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>卷六 庶人｜虎思国学网</title><meta name="description" content="《孝经》庶人"><link rel="canonical" href="https://husir.cn/xiaojing/1649848598.html"><link rel="stylesheet" href="/site.css?v=20260826g"><link rel="icon" href="/favicon.svg" type="image/svg+xml"><link rel="icon" href="/favicon.ico" sizes="any"><meta name="theme-color" content="#102a43"></head><body><header class="site-header"><a class="brand" href="/" aria-label="虎思国学网首页"><img src="/logo.svg" alt="虎思国学网" width="238" height="54"></a><nav class="main-nav" aria-label="主要栏目"><a href="/">首页</a><a href="/jing/">经</a><a href="/shi/">史</a><a href="/zi/">子</a><a href="/ji/">集</a></nav><nav class="user-nav" aria-label="个人功能"><a href="/bookshelf/">我的书架</a><a href="/account/">登录</a></nav></header><main><div class="reader-shell" data-reader data-work="xiaojing" data-work-title="孝经" data-title="卷六 庶人"><nav class="breadcrumbs"><a href="/">首页</a><span>›</span><a href="/jing/">经部</a><span>›</span><a href="/xiaojing/">孝经</a><span>›</span><strong>卷六 庶人</strong></nav><div class="reader-toolbar"><a href="/xiaojing/">☰ 目录</a><button data-font="-2">字小</button><button data-font="2">字大</button><span class="spacer"></span><button class="favorite-button" data-favorite="xiaojing" data-title="孝经">☆ 收藏</button></div><article class="reader-paper"><h1>卷六 庶人</h1><div class="reader-content"> <p>　　用天之道，分地之利，谨身节用，以养父母，此庶人之孝也。故自天子至于 庶人，孝无终始，而患不及者，未之有也。<br><span style="color:#af9100;">　　利用自然的季节，认清土地的高下优劣，行为谨慎，节省俭约，以此来孝养父母，这就是普通老百姓的孝道了。所以上自天子，下至普通老百姓，不论尊卑高下，孝道是无始无终，永恒存在的，有人担心自己不能做到孝，那是没有的事情。</span></p> </div></article><nav class="reader-nav"><a rel="prev" href="/xiaojing/1649848608.html">← 卷五 士</a><a rel="next" href="/xiaojing/1649848587.html">卷七 三才 →</a></nav></div></main><footer class="site-footer"><section class="friend-links" aria-labelledby="friend-title"><h2 id="friend-title">友情链接</h2><div id="friend-links-list"><a href="https://husir.cn/">虎思国学网</a></div></section><div class="footer-meta"><span>公益性传统文化阅读网站</span><span>Copyright © 2002–2026 Husir.cn</span><a target="_blank" rel="nofollow noopener" href="https://beian.miit.gov.cn">闽ICP备2022000160号-2</a></div></footer><script src="/app.js?v=20260826g"></script></body></html>
