<!doctype html><html lang="zh-Hans"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>卷二十九 龚播｜虎思国学网</title><meta name="description" content="《河东记》龚播"><link rel="canonical" href="https://husir.cn/hedongji/1654484180.html"><link rel="stylesheet" href="/site.css?v=20260826g"><link rel="icon" href="/favicon.svg" type="image/svg+xml"><link rel="icon" href="/favicon.ico" sizes="any"><meta name="theme-color" content="#102a43"></head><body><header class="site-header"><a class="brand" href="/" aria-label="虎思国学网首页"><img src="/logo.svg" alt="虎思国学网" width="238" height="54"></a><nav class="main-nav" aria-label="主要栏目"><a href="/">首页</a><a href="/jing/">经</a><a href="/shi/">史</a><a href="/zi/">子</a><a href="/ji/">集</a></nav><nav class="user-nav" aria-label="个人功能"><a href="/bookshelf/">我的书架</a><a href="/account/">登录</a></nav></header><main><div class="reader-shell" data-reader data-work="hedongji" data-work-title="河东记" data-title="卷二十九 龚播"><nav class="breadcrumbs"><a href="/">首页</a><span>›</span><a href="/zi/">子部</a><span>›</span><a href="/hedongji/">河东记</a><span>›</span><strong>卷二十九 龚播</strong></nav><div class="reader-toolbar"><a href="/hedongji/">☰ 目录</a><button data-font="-2">字小</button><button data-font="2">字大</button><span class="spacer"></span><button class="favorite-button" data-favorite="hedongji" data-title="河东记">☆ 收藏</button></div><article class="reader-paper"><h1>卷二十九 龚播</h1><div class="reader-content"> 　　龚播者，峡中云安临盐贾也。其初其穷，以贩鬻蔬果自业，结草庐于江边居之。忽遇风雨之夕，天地阴黑。见江南有炬火，复闻人呼船求济急，时已夜深，人皆息矣。播即独棹小艇，涉风而济之。至则执炬者仆地，视之即金人也，长四尺余。播即载之以归，于是遂富，经营贩鬻，动获厚利。不十余年间，积财巨万，竟为三蜀大贾。 </div></article><nav class="reader-nav"><a rel="prev" href="/hedongji/1654484190.html">← 卷二十八 辛察</a><a rel="next" href="/hedongji/1654484169.html">卷三十 申屠澄 →</a></nav></div></main><footer class="site-footer"><section class="friend-links" aria-labelledby="friend-title"><h2 id="friend-title">友情链接</h2><div id="friend-links-list"><a href="https://husir.cn/">虎思国学网</a></div></secti
