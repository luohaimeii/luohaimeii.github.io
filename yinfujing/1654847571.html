<!doctype html><html lang="zh-Hans"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>上篇｜虎思国学网</title><meta name="description" content="《阴符经》上篇"><link rel="canonical" href="https://husir.cn/yinfujing/1654847571.html"><link rel="stylesheet" href="/site.css?v=20260826g"><link rel="icon" href="/favicon.svg" type="image/svg+xml"><link rel="icon" href="/favicon.ico" sizes="any"><meta name="theme-color" content="#102a43"></head><body><header class="site-header"><a class="brand" href="/" aria-label="虎思国学网首页"><img src="/logo.svg" alt="虎思国学网" width="238" height="54"></a><nav class="main-nav" aria-label="主要栏目"><a href="/">首页</a><a href="/jing/">经</a><a href="/shi/">史</a><a href="/zi/">子</a><a href="/ji/">集</a></nav><nav class="user-nav" aria-label="个人功能"><a href="/bookshelf/">我的书架</a><a href="/account/">登录</a></nav></header><main><div class="reader-shell" data-reader data-work="yinfujing" data-work-title="阴符经" data-title="上篇"><nav class="breadcrumbs"><a href="/">首页</a><span>›</span><a href="/zi/">子部</a><span>›</span><a href="/yinfujing/">阴符经</a><span>›</span><strong>上篇</strong></nav><div class="reader-toolbar"><a href="/yinfujing/">☰ 目录</a><button data-font="-2">字小</button><button data-font="2">字大</button><span class="spacer"></span><button class="favorite-button" data-favorite="yinfujing" data-title="阴符经">☆ 收藏</button></div><article class="reader-paper"><h1>上篇</h1><div class="reader-content"> <p>　　观天之道，执天之行，尽矣。故天有五贼，见之者昌。五贼在心，施行于天。宇宙在乎手，万化生乎身。天性，人也；人心，机也。立天之道，以定人也。天发杀机，移星易宿；地发杀机，龙蛇起陆；人发杀机，天地反覆；天人合发，万化定基。性有巧拙，可以伏藏。九窍之邪，在乎三要，可以动静。火生于木，祸发必克；奸生于国，时动必溃。知之修炼，谓之圣人。</p> </div></article><nav class="reader-nav"><span></span><a rel="next" href="/yinfujing/1654847560.html">中篇 →</a></nav></div></main><footer class="site-footer"><section class="friend-links" aria-labelledby="friend-title"><h2 id="friend-title">友情链接</h2><div id="friend-links-list"><a href="https://husir.cn/">虎思国学网</a></div></section><div class="footer-meta"><span>公益性传统文化阅
