<!doctype html><html lang="zh-Hans"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>卷五 德立｜虎思国学网</title><meta name="description" content="《慎子》德立"><link rel="canonical" href="https://husir.cn/shenzi/1652326952.html"><link rel="stylesheet" href="/site.css?v=20260826g"><link rel="icon" href="/favicon.svg" type="image/svg+xml"><link rel="icon" href="/favicon.ico" sizes="any"><meta name="theme-color" content="#102a43"></head><body><header class="site-header"><a class="brand" href="/" aria-label="虎思国学网首页"><img src="/logo.svg" alt="虎思国学网" width="238" height="54"></a><nav class="main-nav" aria-label="主要栏目"><a href="/">首页</a><a href="/jing/">经</a><a href="/shi/">史</a><a href="/zi/">子</a><a href="/ji/">集</a></nav><nav class="user-nav" aria-label="个人功能"><a href="/bookshelf/">我的书架</a><a href="/account/">登录</a></nav></header><main><div class="reader-shell" data-reader data-work="shenzi" data-work-title="慎子" data-title="卷五 德立"><nav class="breadcrumbs"><a href="/">首页</a><span>›</span><a href="/zi/">子部</a><span>›</span><a href="/shenzi/">慎子</a><span>›</span><strong>卷五 德立</strong></nav><div class="reader-toolbar"><a href="/shenzi/">☰ 目录</a><button data-font="-2">字小</button><button data-font="2">字大</button><span class="spacer"></span><button class="favorite-button" data-favorite="shenzi" data-title="慎子">☆ 收藏</button></div><article class="reader-paper"><h1>卷五 德立</h1><div class="reader-content"> <p>　　立天子者，不使诸侯疑焉；立诸侯者，不使大夫疑焉；立正妻者，不使嬖妾疑焉；立嫡子者，不使庶孽疑焉。疑则动，两则争，杂则相伤，害在有与，不在独也，故臣有两位者，国必乱。臣两位而国不乱者，君在也，恃君而不乱矣，失君必乱。子有两位者，家必乱，子两位而家不乱者，父在也，恃父而不乱矣，失父必乱。臣疑其君，无不危之国；孽疑其宗，无不危之家。</p> </div></article><nav class="reader-nav"><a rel="prev" href="/shenzi/1652326962.html">← 卷四 知忠</a><a rel="next" href="/shenzi/1652326941.html">卷六 君人 →</a></nav></div></main><footer class="site-footer"><section class="friend-links" aria-labelledby="friend-title"><h2 id="friend-title">友情链接</h2><div id="friend-links-list"><a href="https://husir.cn/">虎思国学网</a></div></section><d
