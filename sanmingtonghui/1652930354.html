<!doctype html><html lang="zh-Hans"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>卷六·勾陈得位｜虎思国学网</title><meta name="description" content="《三命通会》卷六·勾陈得位"><link rel="canonical" href="https://husir.cn/sanmingtonghui/1652930354.html"><link rel="stylesheet" href="/site.css?v=20260826g"><link rel="icon" href="/favicon.svg" type="image/svg+xml"><link rel="icon" href="/favicon.ico" sizes="any"><meta name="theme-color" content="#102a43"></head><body><header class="site-header"><a class="brand" href="/" aria-label="虎思国学网首页"><img src="/logo.svg" alt="虎思国学网" width="238" height="54"></a><nav class="main-nav" aria-label="主要栏目"><a href="/">首页</a><a href="/jing/">经</a><a href="/shi/">史</a><a href="/zi/">子</a><a href="/ji/">集</a></nav><nav class="user-nav" aria-label="个人功能"><a href="/bookshelf/">我的书架</a><a href="/account/">登录</a></nav></header><main><div class="reader-shell" data-reader data-work="sanmingtonghui" data-work-title="三命通会" data-title="卷六·勾陈得位"><nav class="breadcrumbs"><a href="/">首页</a><span>›</span><a href="/zi/">子部</a><span>›</span><a href="/sanmingtonghui/">三命通会</a><span>›</span><strong>卷六·勾陈得位</strong></nav><div class="reader-toolbar"><a href="/sanmingtonghui/">☰ 目录</a><button data-font="-2">字小</button><button data-font="2">字大</button><span class="spacer"></span><button class="favorite-button" data-favorite="sanmingtonghui" data-title="三命通会">☆ 收藏</button></div><article class="reader-paper"><h1>卷六·勾陈得位</h1><div class="reader-content"> <p>　　戊己土属中央，谓之勾陈当位，即当权之义。如戊寅、戊辰、戊子、戊申、乙卯、己亥、己未，皆坐下财官印，若身旺，官得时者贵，财得时者富，不见伤官劫财为妙，忌冲刑，煞旺生灾，岁运同。诗曰：戊己勾陈在旺乡，寅卯之宫号最强，若是更临辰卯未，亥子相逢大吉昌。又：日干戊己坐财官，号曰勾陈得位看，知有大财分瑞气，命中值此列朝班。</p> </div></article><nav class="reader-nav"><a rel="prev" href="/sanmingtonghui/1652930365.html">← 卷六·玄武当权</a><a rel="next" href="/sanmingtonghui/1652930344.html">卷六·还魂借气 →</a></nav></div></main><footer class="site-footer"><section class="friend-links" aria-labelledby="friend-title"><h2 id="friend-title">友情链接</h2><div id="f
