<!doctype html><html lang="zh-Hans"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>卷八·风伯｜虎思国学网</title><meta name="description" content="《风俗演义》卷八·风伯"><link rel="canonical" href="https://husir.cn/fengsuyanyi/1653617989.html"><link rel="stylesheet" href="/site.css?v=20260826g"><link rel="icon" href="/favicon.svg" type="image/svg+xml"><link rel="icon" href="/favicon.ico" sizes="any"><meta name="theme-color" content="#102a43"></head><body><header class="site-header"><a class="brand" href="/" aria-label="虎思国学网首页"><img src="/logo.svg" alt="虎思国学网" width="238" height="54"></a><nav class="main-nav" aria-label="主要栏目"><a href="/">首页</a><a href="/jing/">经</a><a href="/shi/">史</a><a href="/zi/">子</a><a href="/ji/">集</a></nav><nav class="user-nav" aria-label="个人功能"><a href="/bookshelf/">我的书架</a><a href="/account/">登录</a></nav></header><main><div class="reader-shell" data-reader data-work="fengsuyanyi" data-work-title="风俗演义" data-title="卷八·风伯"><nav class="breadcrumbs"><a href="/">首页</a><span>›</span><a href="/zi/">子部</a><span>›</span><a href="/fengsuyanyi/">风俗演义</a><span>›</span><strong>卷八·风伯</strong></nav><div class="reader-toolbar"><a href="/fengsuyanyi/">☰ 目录</a><button data-font="-2">字小</button><button data-font="2">字大</button><span class="spacer"></span><button class="favorite-button" data-favorite="fengsuyanyi" data-title="风俗演义">☆ 收藏</button></div><article class="reader-paper"><h1>卷八·风伯</h1><div class="reader-content"> <p>　　《楚辞》说：“後飞廉使奔属。”飞廉，风伯也。</p> <p>　　谨按《周礼》：“以□□燎祀风师。”风师者，箕星也。箕主簸扬，能致风气。《易》：“巽为长女也。”长者伯，故曰风伯。鼓之以雷霆，润之以风雨，养成万物，有功於人，王者祀以报功也。戌之神为风伯，故以丙戌日祀於西北，火胜金为木相也。</p> </div></article><nav class="reader-nav"><a rel="prev" href="/fengsuyanyi/1653618004.html">← 卷八·灶神</a><a rel="next" href="/fengsuyanyi/1653617977.html">卷八·雨师 →</a></nav></div></main><footer class="site-footer"><section class="friend-links" aria-labelledby="friend-title"><h2 id="friend-title">友情链接</h2><div id="friend-links-list"><a href="https://husir.cn/">虎思国学网</a></div></section><div class="footer-meta"><span>公益性传统文化阅读网站</span><span>Copyright © 2002–2026 Husir.cn</span><a target="_blank" rel="nofollow noopener" href="https://beian.miit.gov.cn">闽ICP备2022000160号-2</a></div></footer><script src="/app.js?v=20260826g"></script></body></html>
