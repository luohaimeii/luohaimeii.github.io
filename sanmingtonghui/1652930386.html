<!doctype html><html lang="zh-Hans"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>卷六·白虎持势｜虎思国学网</title><meta name="description" content="《三命通会》卷六·白虎持势"><link rel="canonical" href="https://husir.cn/sanmingtonghui/1652930386.html"><link rel="stylesheet" href="/site.css?v=20260826g"><link rel="icon" href="/favicon.svg" type="image/svg+xml"><link rel="icon" href="/favicon.ico" sizes="any"><meta name="theme-color" content="#102a43"></head><body><header class="site-header"><a class="brand" href="/" aria-label="虎思国学网首页"><img src="/logo.svg" alt="虎思国学网" width="238" height="54"></a><nav class="main-nav" aria-label="主要栏目"><a href="/">首页</a><a href="/jing/">经</a><a href="/shi/">史</a><a href="/zi/">子</a><a href="/ji/">集</a></nav><nav class="user-nav" aria-label="个人功能"><a href="/bookshelf/">我的书架</a><a href="/account/">登录</a></nav></header><main><div class="reader-shell" data-reader data-work="sanmingtonghui" data-work-title="三命通会" data-title="卷六·白虎持势"><nav class="breadcrumbs"><a href="/">首页</a><span>›</span><a href="/zi/">子部</a><span>›</span><a href="/sanmingtonghui/">三命通会</a><span>›</span><strong>卷六·白虎持势</strong></nav><div class="reader-toolbar"><a href="/sanmingtonghui/">☰ 目录</a><button data-font="-2">字小</button><button data-font="2">字大</button><span class="spacer"></span><button class="favorite-button" data-favorite="sanmingtonghui" data-title="三命通会">☆ 收藏</button></div><article class="reader-paper"><h1>卷六·白虎持势</h1><div class="reader-content"> <p>　　庚辛金属西方，谓之白虎持势者，得其势也。如庚午、庚寅、庚戌、辛巳、辛卯、辛未，此六日生，坐下财官印贵，要日主有托受生气，或官旺得时有助，不见财官，用官必贵，用财必富，岁运同。有以辛卯日时犯白虎，不利勇猛战斗，令人多有眼目之疾，重犯尤忌之。诗曰：白虎持世寅卯强，如临巳午未戌乡，四野遇之多富贵，必向皇都作栋梁。</p> </div></article><nav class="reader-nav"><a rel="prev" href="/sanmingtonghui/1652930396.html">← 卷六·青龙伏形</a><a rel="next" href="/sanmingtonghui/1652930376.html">卷六·朱雀乘风 →</a></nav></div></main><footer class="site-footer"><section class="friend-links" aria-labelledby="friend-title"><h2 id="friend-title">友情链接</h2><div id="fri
