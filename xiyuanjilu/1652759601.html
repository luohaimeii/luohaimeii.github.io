<!doctype html><html lang="zh-Hans"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>卷四·尸首异处｜虎思国学网</title><meta name="description" content="《洗冤集录》卷四·尸首异处"><link rel="canonical" href="https://husir.cn/xiyuanjilu/1652759601.html"><link rel="stylesheet" href="/site.css?v=20260826g"><link rel="icon" href="/favicon.svg" type="image/svg+xml"><link rel="icon" href="/favicon.ico" sizes="any"><meta name="theme-color" content="#102a43"></head><body><header class="site-header"><a class="brand" href="/" aria-label="虎思国学网首页"><img src="/logo.svg" alt="虎思国学网" width="238" height="54"></a><nav class="main-nav" aria-label="主要栏目"><a href="/">首页</a><a href="/jing/">经</a><a href="/shi/">史</a><a href="/zi/">子</a><a href="/ji/">集</a></nav><nav class="user-nav" aria-label="个人功能"><a href="/bookshelf/">我的书架</a><a href="/account/">登录</a></nav></header><main><div class="reader-shell" data-reader data-work="xiyuanjilu" data-work-title="洗冤集录" data-title="卷四·尸首异处"><nav class="breadcrumbs"><a href="/">首页</a><span>›</span><a href="/zi/">子部</a><span>›</span><a href="/xiyuanjilu/">洗冤集录</a><span>›</span><strong>卷四·尸首异处</strong></nav><div class="reader-toolbar"><a href="/xiyuanjilu/">☰ 目录</a><button data-font="-2">字小</button><button data-font="2">字大</button><span class="spacer"></span><button class="favorite-button" data-favorite="xiyuanjilu" data-title="洗冤集录">☆ 收藏</button></div><article class="reader-paper"><h1>卷四·尸首异处</h1><div class="reader-content"> <p>　　凡验尸首异处，勒家属先辨认尸首。务要仔细打量尸首顿处四至。讫，次量首级离尸远近，或左、或右，或去肩脚若干尺寸。支解手臂、脚腿，各量别计，仍各写相去尸远近。却随其所解肢体与尸相凑，提捧首与项相凑。围量分寸一般，系刃物斫落。若项下皮肉卷凸，两肩井耸皮HT ，系生前斫落；皮肉不卷凸，两肩井不耸HT ，系死后斫落。</p> </div></article><nav class="reader-nav"><a rel="prev" href="/xiyuanjilu/1652759611.html">← 卷四·杀伤</a><a rel="next" href="/xiyuanjilu/1652759590.html">卷四·火死 →</a></nav></div></main><footer class="site-footer"><section class="friend-links" aria-labelledby="friend-title"><h2 id="friend-title">友情链接</h2><div id="friend-links-list"><a href="https:/
