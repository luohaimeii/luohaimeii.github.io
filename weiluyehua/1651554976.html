<!doctype html><html lang="zh-Hans"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>第一五五则｜虎思国学网</title><meta name="description" content="《围炉夜话》第一五五则"><link rel="canonical" href="https://husir.cn/weiluyehua/1651554976.html"><link rel="stylesheet" href="/site.css?v=20260826g"><link rel="icon" href="/favicon.svg" type="image/svg+xml"><link rel="icon" href="/favicon.ico" sizes="any"><meta name="theme-color" content="#102a43"></head><body><header class="site-header"><a class="brand" href="/" aria-label="虎思国学网首页"><img src="/logo.svg" alt="虎思国学网" width="238" height="54"></a><nav class="main-nav" aria-label="主要栏目"><a href="/">首页</a><a href="/jing/">经</a><a href="/shi/">史</a><a href="/zi/">子</a><a href="/ji/">集</a></nav><nav class="user-nav" aria-label="个人功能"><a href="/bookshelf/">我的书架</a><a href="/account/">登录</a></nav></header><main><div class="reader-shell" data-reader data-work="weiluyehua" data-work-title="围炉夜话" data-title="第一五五则"><nav class="breadcrumbs"><a href="/">首页</a><span>›</span><a href="/zi/">子部</a><span>›</span><a href="/weiluyehua/">围炉夜话</a><span>›</span><strong>第一五五则</strong></nav><div class="reader-toolbar"><a href="/weiluyehua/">☰ 目录</a><button data-font="-2">字小</button><button data-font="2">字大</button><span class="spacer"></span><button class="favorite-button" data-favorite="weiluyehua" data-title="围炉夜话">☆ 收藏</button></div><article class="reader-paper"><h1>第一五五则</h1><div class="reader-content"> <p>　　念祖考创家基，不知栉风沐雨，受多少苦辛，才能足食足衣，以贻后世；为子孙计长久，除却读书耕田，恐别无生活，总期克勤克俭，毋负先人。<br><span style="color:#af9100;">　　想到祖先创立家业，不知受过多少艰辛，经过多少努力，才能够衣食暖饱，留下财产给后代子孙。若要为子孙作长久的打算，除了读书和耕田外，恐怕就没有别的了，总希望他们能勤俭生活，不要辜负了先人的辛劳。</span></p> </div></article><nav class="reader-nav"><a rel="prev" href="/weiluyehua/1651554985.html">← 第一五四则</a><a rel="next" href="/weiluyehua/1651554966.html">第一五六则 →</a></nav></div></main><footer class="site-footer"><section class="friend-links" aria-labelledby="friend-title"><h2 id="friend-title">友情链接</h2><div id
