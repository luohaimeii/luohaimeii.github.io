<!doctype html><html lang="zh-Hans"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>卷十三 水部·温汤｜虎思国学网</title><meta name="description" content="《本草纲目》水部·温汤"><link rel="canonical" href="https://husir.cn/bencaogangmu/1652497659.html"><link rel="stylesheet" href="/site.css?v=20260826g"><link rel="icon" href="/favicon.svg" type="image/svg+xml"><link rel="icon" href="/favicon.ico" sizes="any"><meta name="theme-color" content="#102a43"></head><body><header class="site-header"><a class="brand" href="/" aria-label="虎思国学网首页"><img src="/logo.svg" alt="虎思国学网" width="238" height="54"></a><nav class="main-nav" aria-label="主要栏目"><a href="/">首页</a><a href="/jing/">经</a><a href="/shi/">史</a><a href="/zi/">子</a><a href="/ji/">集</a></nav><nav class="user-nav" aria-label="个人功能"><a href="/bookshelf/">我的书架</a><a href="/account/">登录</a></nav></header><main><div class="reader-shell" data-reader data-work="bencaogangmu" data-work-title="本草纲目" data-title="卷十三 水部·温汤"><nav class="breadcrumbs"><a href="/">首页</a><span>›</span><a href="/zi/">子部</a><span>›</span><a href="/bencaogangmu/">本草纲目</a><span>›</span><strong>卷十三 水部·温汤</strong></nav><div class="reader-toolbar"><a href="/bencaogangmu/">☰ 目录</a><button data-font="-2">字小</button><button data-font="2">字大</button><span class="spacer"></span><button class="favorite-button" data-favorite="bencaogangmu" data-title="本草纲目">☆ 收藏</button></div><article class="reader-paper"><h1>卷十三 水部·温汤</h1><div class="reader-content"> <p><strong>释名</strong><br>亦名温泉、沸泉。种类甚多。有硫磺泉，比较常见；有泉砂泉，见于新安黄山；有矾石泉，见于西安骊山。</p> <p><strong>气味</strong><br>辛、热、微毒。</p> <p><strong>主治</strong><br>筋骨挛缩，肌皮顽痹，手足不遂，眉发脱落以及各种疥癣等症。</p> <p><strong>附方</strong><br>上列气味与主治，主要是就硫磺泉而言，其他温泉，大都无毒(含砒石的温泉除外)，即可烹茶，洗浴亦好。</p> </div></article><nav class="reader-nav"><a rel="prev" href="/bencaogangmu/1652497670.html">← 卷十二 水部·地浆</a><a rel="next" href="/bencaogangmu/1652497649.html">卷十四 水部·盐胆水 →</a></nav></div></main><footer class="site-footer"><section class="f
