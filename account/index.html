<!doctype html><html lang="zh-Hans"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>读者登录｜虎思国学网</title><meta name="description" content="虎思国学网书架账户"><link rel="canonical" href="https://husir.cn/account/"><link rel="stylesheet" href="/site.css?v=20260826g"><link rel="icon" href="/favicon.svg" type="image/svg+xml"><link rel="icon" href="/favicon.ico" sizes="any"><meta name="theme-color" content="#102a43"></head><body><header class="site-header"><a class="brand" href="/" aria-label="虎思国学网首页"><img src="/logo.svg" alt="虎思国学网" width="238" height="54"></a><nav class="main-nav" aria-label="主要栏目"><a href="/">首页</a><a href="/jing/">经</a><a href="/shi/">史</a><a href="/zi/">子</a><a href="/ji/">集</a></nav><nav class="user-nav" aria-label="个人功能"><a href="/bookshelf/">我的书架</a><a href="/account/">登录</a></nav></header><main><div class="page-shell"><nav class="breadcrumbs"><a href="/">首页</a><span>›</span><strong>读者账户</strong></nav><section class="panel"><h1>轻量书架账户</h1><p class="notice">无需邮箱和手机号。注册后请妥善保存“书架编号”和“恢复码”，丢失后无法找回。</p><div id="account-status"></div><div id="account-forms"><div class="form-grid"><label>昵称<input id="display-name" maxlength="30" value="古籍读者"></label><button id="register" class="primary-button">创建我的书架</button></div><hr><div class="form-grid"><label>书架编号<input id="reader-code" autocomplete="username"></label><label>恢复码<input id="recovery-code" type="password" autocomplete="current-password"></label><button id="login" class="secondary-button">登录已有书架</button></div></div><div id="account-result" class="notice" hidden></div></section></div></main><footer class="site-footer"><section class="friend-links" aria-labelledby="friend-title"><h2 id="friend-title">友情链接</h2><div id="friend-links-list"><a href="https://husir.cn/">虎思国学网</a></div></section><div class="footer-meta"><span>公益性传统文化阅读网站</span><span>Copyright © 2002–2026 Husir.cn</span><a target="_blank" rel="nofollow noopener" href="https://beian.miit.gov.cn">闽ICP备2022000160号-2</a></div></footer><script src="/app.js?v=20260826g"></script><script>(()=>{const {api,AUTH}=window.HusirApi,result=document.querySelector('#account-result'),forms=document.querySelector('#account-forms'),status=document.querySelector('#account-status');const show=m=>{result.hidden=false;result.innerHTML=m};api('/api/account/status').then(r=>r.json()).then(data=>{if(data.authenticated){localStorage.setItem(AUTH,'1');forms.hidden=true;status.innerHTML='<p>欢迎回来，<b>'+data.displayName+'</b>（'+data.readerCode+'）</p><button id="logout" class="secondary-button">退出登录</button>';document.querySelector('#logout').onclick=()=>api('/api/account/logout',{method:'POST'}).then(()=>{localStorage.removeItem(AUTH);location.reload()})}else localStorage.removeItem(AUTH)});document.querySelector('#register').onclick=()=>api('/api/account/register',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({displayName:document.querySelector('#display-name').value})}).then(async r=>({ok:r.ok,data:await r.json()})).then(({ok,data})=>{if(!ok)return show(data.error);localStorage.setItem(AUTH,'1');show('<b>注册成功，请立即保存：</b><br>书架编号：<code>'+data.readerCode+'</code><br>恢复码：<code>'+data.recoveryCode+'</code>')});document.querySelector('#login').onclick=()=>api('/api/account/login',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({readerCode:document.querySelector('#reader-code').value,recoveryCode:document.querySelector('#recovery-code').value})}).then(async r=>({ok:r.ok,data:await r.json()})).then(({ok,data})=>{if(!ok)return show(data.error);localStorage.setItem(AUTH,'1');location.reload()})})();</script></body></html>
