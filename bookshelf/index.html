<!doctype html><html lang="zh-Hans"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>我的书架｜虎思国学网</title><meta name="description" content="查看收藏的典籍与最近阅读记录"><link rel="canonical" href="https://husir.cn/bookshelf/"><link rel="stylesheet" href="/site.css?v=20260826g"><link rel="icon" href="/favicon.svg" type="image/svg+xml"><link rel="icon" href="/favicon.ico" sizes="any"><meta name="theme-color" content="#102a43"></head><body><header class="site-header"><a class="brand" href="/" aria-label="虎思国学网首页"><img src="/logo.svg" alt="虎思国学网" width="238" height="54"></a><nav class="main-nav" aria-label="主要栏目"><a href="/">首页</a><a href="/jing/">经</a><a href="/shi/">史</a><a href="/zi/">子</a><a href="/ji/">集</a></nav><nav class="user-nav" aria-label="个人功能"><a href="/bookshelf/">我的书架</a><a href="/account/">登录</a></nav></header><main><div class="page-shell"><nav class="breadcrumbs"><a href="/">首页</a><span>›</span><strong>我的书架</strong></nav><section class="museum-bar"><h1>我的书架</h1><p>未登录也可使用，记录只保存在当前浏览器；登录后可跨设备同步。</p><a class="primary-button" href="/account/">登录或注册</a></section><section class="panel"><h2>收藏典籍</h2><div id="favorite-list" class="chapter-list"></div><p id="favorite-empty">暂无收藏，从典籍卡片点击“收藏”即可加入。</p></section><section class="panel"><h2>最近阅读</h2><div id="history-list" class="chapter-list"></div><p id="history-empty">还没有阅读记录。</p></section></div></main><footer class="site-footer"><section class="friend-links" aria-labelledby="friend-title"><h2 id="friend-title">友情链接</h2><div id="friend-links-list"><a href="https://husir.cn/">虎思国学网</a></div></section><div class="footer-meta"><span>公益性传统文化阅读网站</span><span>Copyright © 2002–2026 Husir.cn</span><a target="_blank" rel="nofollow noopener" href="https://beian.miit.gov.cn">闽ICP备2022000160号-2</a></div></footer><script src="/app.js?v=20260826g"></script><script>(()=>{const {api,AUTH,FAVORITES,HISTORY,read,write}=window.HusirApi,favorites=read(FAVORITES),history=read(HISTORY);const render=(id,empty,rows,href,label)=>{const box=document.getElementById(id);box.replaceChildren(...rows.map(row=>{const a=document.createElement('a');a.href=href(row);a.textContent=label(row);return a}));document.getElementById(empty).hidden=rows.length>0};const done=()=>{render('favorite-list','favorite-empty',favorites,x=>'/'+x.slug+'/',x=>'《'+x.title+'》');render('history-list','history-empty',history.slice(0,30),x=>x.path,x=>(x.workTitle||'典籍')+' · '+x.title)};if(localStorage.getItem(AUTH)==='1')api('/api/bookshelf').then(r=>r.ok?r.json():null).then(remote=>{if(!remote)return;remote.favorites.forEach(x=>{if(!favorites.some(y=>y.slug===x.work_slug))favorites.push({slug:x.work_slug,title:x.work_title})});remote.history.forEach(x=>{if(!history.some(y=>y.path===x.chapter_path))history.push({path:x.chapter_path,workTitle:x.work_title,title:x.chapter_title})});write(FAVORITES,favorites);write(HISTORY,history)}).finally(done);else done()})();</script></body></html>
