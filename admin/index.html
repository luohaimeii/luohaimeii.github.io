<!doctype html><html lang="zh-Hans"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>网站管理后台｜虎思国学网</title><meta name="description" content="虎思国学网管理后台"><link rel="canonical" href="https://husir.cn/admin/"><link rel="stylesheet" href="/site.css?v=20260826g"><link rel="icon" href="/favicon.svg" type="image/svg+xml"><link rel="icon" href="/favicon.ico" sizes="any"><meta name="theme-color" content="#102a43"></head><body><header class="site-header"><a class="brand" href="/" aria-label="虎思国学网首页"><img src="/logo.svg" alt="虎思国学网" width="238" height="54"></a><nav class="main-nav" aria-label="主要栏目"><a href="/">首页</a><a href="/jing/">经</a><a href="/shi/">史</a><a href="/zi/">子</a><a href="/ji/">集</a></nav><nav class="user-nav" aria-label="个人功能"><a href="/bookshelf/">我的书架</a><a href="/account/">登录</a></nav></header><main><div class="page-shell"><nav class="breadcrumbs"><a href="/">首页</a><span>›</span><strong>管理后台</strong></nav><section id="admin-loading" class="panel"><h1>正在读取管理后台…</h1></section><div id="admin-content" hidden><section class="museum-bar"><h1>管理后台</h1><p>典籍修订、友情链接与读者书架统计</p><button id="admin-logout" class="secondary-button">退出</button></section><section id="admin-stats" class="book-grid admin-stats"></section><section class="panel"><h2>正文管理</h2><p class="notice">静态公开页不会在保存后即时变化；修订记录保存在 D1，需执行静态发布流程后上线。</p><form id="content-form" class="form-grid"><label>正文路径<input name="path" required placeholder="/yijing/1650012208.html"></label><button type="button" id="load-content" class="secondary-button">读取</button><label>所属典籍英文目录<input name="workSlug" required></label><label>标题<input name="title" required></label><label>摘要<input name="description"></label><label>正文 HTML<textarea name="bodyHtml" rows="15" required></textarea></label><label>状态<select name="status"><option value="draft">草稿</option><option value="published">发布</option><option value="hidden">隐藏</option></select></label><button class="primary-button">保存修订</button></form><p id="content-result"></p></section><section class="panel"><h2>友情链接</h2><form id="link-form" class="form-grid"><label>网站名称<input name="name" required></label><label>网址<input name="url" type="url" required></label><label>排序<input name="sortOrder" type="number" value="0"></label><label><input name="enabled" type="checkbox" checked> 启用</label><button class="primary-button">添加链接</button></form><div class="table-wrap"><table><thead><tr><th>名称</th><th>网址</th><th>排序</th><th>状态</th><th>操作</th></tr></thead><tbody id="links-table"></tbody></table></div></section><section class="panel"><h2>最近注册读者（仅显示匿名书架信息）</h2><div class="table-wrap"><table><thead><tr><th>书架编号</th><th>昵称</th><th>收藏</th><th>阅读记录</th><th>注册时间</th></tr></thead><tbody id="readers-table"></tbody></table></div></section></div></div></main><footer class="site-footer"><section class="friend-links" aria-labelledby="friend-title"><h2 id="friend-title">友情链接</h2><div id="friend-links-list"><a href="https://husir.cn/">虎思国学网</a></div></section><div class="footer-meta"><span>公益性传统文化阅读网站</span><span>Copyright © 2002–2026 Husir.cn</span><a target="_blank" rel="nofollow noopener" href="https://beian.miit.gov.cn">闽ICP备2022000160号-2</a></div></footer><script src="/app.js?v=20260826g"></script><script>(()=>{const api=window.HusirApi.api,loading=document.querySelector('#admin-loading'),content=document.querySelector('#admin-content'),contentForm=document.querySelector('#content-form'),result=document.querySelector('#content-result');const loadDashboard=()=>api('/api/admin/dashboard').then(async r=>({ok:r.ok,data:await r.json()})).then(({ok,data})=>{if(!ok){loading.innerHTML='<h1>管理员登录已过期</h1><p>'+data.error+'</p><a class="primary-button" href="/admin/login/">前往登录</a>';return}loading.hidden=true;content.hidden=false;document.querySelector('#admin-stats').innerHTML=[['读者',data.stats.readers],['收藏',data.stats.favorites],['阅读记录',data.stats.histories],['正文修订',data.stats.overrides]].map(x=>'<div class="panel"><b>'+x[0]+'</b><h2>'+x[1]+'</h2></div>').join('');document.querySelector('#links-table').innerHTML=data.links.map(x=>'<tr><td>'+x.name+'</td><td>'+x.url+'</td><td>'+x.sort_order+'</td><td>'+(x.enabled?'启用':'停用')+'</td><td><button data-delete-link="'+x.id+'">删除</button></td></tr>').join('');document.querySelector('#readers-table').innerHTML=data.readers.map(x=>'<tr><td>'+x.reader_code+'</td><td>'+x.display_name+'</td><td>'+x.favorite_count+'</td><td>'+x.history_count+'</td><td>'+x.created_at+'</td></tr>').join('');document.querySelectorAll('[data-delete-link]').forEach(b=>b.onclick=()=>{if(confirm('确认删除这条友情链接？'))api('/api/admin/friend-links?id='+b.dataset.deleteLink,{method:'DELETE'}).then(loadDashboard)})});loadDashboard();document.querySelector('#load-content').onclick=()=>api('/api/admin/content?path='+encodeURIComponent(contentForm.path.value)).then(r=>r.json()).then(data=>{if(data.error){result.textContent=data.error;return}for(const [key,value] of Object.entries(data)){const field=contentForm[key];if(field)field.value=value||''}});contentForm.onsubmit=event=>{event.preventDefault();api('/api/admin/content',{method:'PUT',headers:{'content-type':'application/json'},body:JSON.stringify(Object.fromEntries(new FormData(contentForm)))}).then(async r=>({ok:r.ok,data:await r.json()})).then(x=>result.textContent=x.ok?'保存成功':x.data.error)};document.querySelector('#link-form').onsubmit=event=>{event.preventDefault();const form=event.currentTarget,values=Object.fromEntries(new FormData(form));values.enabled=form.enabled.checked;api('/api/admin/friend-links',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify(values)}).then(loadDashboard)};document.querySelector('#admin-logout').onclick=()=>api('/api/admin/logout',{method:'POST'}).then(()=>location.href='/admin/login/')})();</script></body></html>
