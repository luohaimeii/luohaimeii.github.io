<!doctype html><html lang="zh-Hans"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>第二Ｏ九则｜虎思国学网</title><meta name="description" content="《围炉夜话》第二Ｏ九则"><link rel="canonical" href="https://husir.cn/weiluyehua/1651554459.html"><link rel="stylesheet" href="/site.css?v=20260826g"><link rel="icon" href="/favicon.svg" type="image/svg+xml"><link rel="icon" href="/favicon.ico" sizes="any"><meta name="theme-color" content="#102a43"></head><body><header class="site-header"><a class="brand" href="/" aria-label="虎思国学网首页"><img src="/logo.svg" alt="虎思国学网" width="238" height="54"></a><nav class="main-nav" aria-label="主要栏目"><a href="/">首页</a><a href="/jing/">经</a><a href="/shi/">史</a><a href="/zi/">子</a><a href="/ji/">集</a></nav><nav class="user-nav" aria-label="个人功能"><a href="/bookshelf/">我的书架</a><a href="/account/">登录</a></nav></header><main><div class="reader-shell" data-reader data-work="weiluyehua" data-work-title="围炉夜话" data-title="第二Ｏ九则"><nav class="breadcrumbs"><a href="/">首页</a><span>›</span><a href="/zi/">子部</a><span>›</span><a href="/weiluyehua/">围炉夜话</a><span>›</span><strong>第二Ｏ九则</strong></nav><div class="reader-toolbar"><a href="/weiluyehua/">☰ 目录</a><button data-font="-2">字小</button><button data-font="2">字大</button><span class="spacer"></span><button class="favorite-button" data-favorite="weiluyehua" data-title="围炉夜话">☆ 收藏</button></div><article class="reader-paper"><h1>第二Ｏ九则</h1><div class="reader-content"> <p>　　凡人世险奇之事，决不可为，或为之而幸获其利，特偶然耳，不可视为常然也。可以为常者，必其平淡无奇，如耕田读书之类是也。<br><span style="color:#af9100;">　　凡是人世间危险奇怪的事情，都不要去做，虽然有人因为做了这些事而侥幸得到利益，那也不过是偶然罢了！不能把它视为常理。可以视作常理的，一定是平淡而没有什么奇特的事，例如耕田、读书之类的事便是。</span></p> </div></article><nav class="reader-nav"><a rel="prev" href="/weiluyehua/1651554469.html">← 第二Ｏ八则</a><a rel="next" href="/weiluyehua/1651554450.html">第二一Ｏ则 →</a></nav></div></main><footer class="site-footer"><section class="friend-links" aria-labelledby="friend-title"><h2 id="friend-title">友情链接</h2><div id="frien
