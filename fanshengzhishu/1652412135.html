<!doctype html><html lang="zh-Hans"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>卷十三 麻｜虎思国学网</title><meta name="description" content="《氾胜之书》麻"><link rel="canonical" href="https://husir.cn/fanshengzhishu/1652412135.html"><link rel="stylesheet" href="/site.css?v=20260826g"><link rel="icon" href="/favicon.svg" type="image/svg+xml"><link rel="icon" href="/favicon.ico" sizes="any"><meta name="theme-color" content="#102a43"></head><body><header class="site-header"><a class="brand" href="/" aria-label="虎思国学网首页"><img src="/logo.svg" alt="虎思国学网" width="238" height="54"></a><nav class="main-nav" aria-label="主要栏目"><a href="/">首页</a><a href="/jing/">经</a><a href="/shi/">史</a><a href="/zi/">子</a><a href="/ji/">集</a></nav><nav class="user-nav" aria-label="个人功能"><a href="/bookshelf/">我的书架</a><a href="/account/">登录</a></nav></header><main><div class="reader-shell" data-reader data-work="fanshengzhishu" data-work-title="氾胜之书" data-title="卷十三 麻"><nav class="breadcrumbs"><a href="/">首页</a><span>›</span><a href="/zi/">子部</a><span>›</span><a href="/fanshengzhishu/">氾胜之书</a><span>›</span><strong>卷十三 麻</strong></nav><div class="reader-toolbar"><a href="/fanshengzhishu/">☰ 目录</a><button data-font="-2">字小</button><button data-font="2">字大</button><span class="spacer"></span><button class="favorite-button" data-favorite="fanshengzhishu" data-title="氾胜之书">☆ 收藏</button></div><article class="reader-paper"><h1>卷十三 麻</h1><div class="reader-content"> <p>　　种麻，豫调和田。二月下旬，三月上旬，傍雨种之。麻生布叶，锄之。率九尺一树。树高一尺，以蚕矢粪之，树三升；无蚕矢，以溷中熟粪粪之亦善，树一升。天旱，以流水浇之，树五升；无流水，曝井水，杀其寒气以浇之。雨泽时适，勿浇。浇不欲数。养麻如此，美田则亩五十石，及百石，薄田尚三十石。获麻之法，霜下实成，速斫之；其树大者，以锯锯之。</p> </div></article><nav class="reader-nav"><a rel="prev" href="/fanshengzhishu/1652412146.html">← 卷十二 枲</a><a rel="next" href="/fanshengzhishu/1652412125.html">卷十四 瓜 →</a></nav></div></main><footer class="site-footer"><section class="friend-links" aria-labelledby="friend-title"><h2 id="friend-title">友情链接</h2><div id="friend-links-li
