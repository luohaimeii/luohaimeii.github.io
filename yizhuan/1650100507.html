<!doctype html><html lang="zh-Hans"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>彖传下·归妹｜虎思国学网</title><meta name="description" content="《易传》彖传下·归妹"><link rel="canonical" href="https://husir.cn/yizhuan/1650100507.html"><link rel="stylesheet" href="/site.css?v=20260826g"><link rel="icon" href="/favicon.svg" type="image/svg+xml"><link rel="icon" href="/favicon.ico" sizes="any"><meta name="theme-color" content="#102a43"></head><body><header class="site-header"><a class="brand" href="/" aria-label="虎思国学网首页"><img src="/logo.svg" alt="虎思国学网" width="238" height="54"></a><nav class="main-nav" aria-label="主要栏目"><a href="/">首页</a><a href="/jing/">经</a><a href="/shi/">史</a><a href="/zi/">子</a><a href="/ji/">集</a></nav><nav class="user-nav" aria-label="个人功能"><a href="/bookshelf/">我的书架</a><a href="/account/">登录</a></nav></header><main><div class="reader-shell" data-reader data-work="yizhuan" data-work-title="易传" data-title="彖传下·归妹"><nav class="breadcrumbs"><a href="/">首页</a><span>›</span><a href="/jing/">经部</a><span>›</span><a href="/yizhuan/">易传</a><span>›</span><strong>彖传下·归妹</strong></nav><div class="reader-toolbar"><a href="/yizhuan/">☰ 目录</a><button data-font="-2">字小</button><button data-font="2">字大</button><span class="spacer"></span><button class="favorite-button" data-favorite="yizhuan" data-title="易传">☆ 收藏</button></div><article class="reader-paper"><h1>彖传下·归妹</h1><div class="reader-content"> <p>　　归妹，天地之大义也。天地不交，而万物不兴。归妹，人之终始也。说以动，所归妹也。征凶，位不当也。无攸利，柔乘刚也。<br><span style="color:#af9100;">　　归妹，是存在于天地间的大道义。天地（阴阳之气）不交，则万物就不会兴盛。归妹，又是人生的终结与开始。喜悦而动，所以归妹。“出征有凶”，（中四爻）位置不正当。“无所利”，阴柔乘凌阳刚之上。</span></p> </div></article><nav class="reader-nav"><a rel="prev" href="/yizhuan/1650100517.html">← 彖传下·渐</a><a rel="next" href="/yizhuan/1650100498.html">彖传下·丰 →</a></nav></div></main><footer class="site-footer"><section class="friend-links" aria-labelledby="friend-title"><h2 id="friend-title">友情链接</h2><div id="friend-links-list"><a href="htt
