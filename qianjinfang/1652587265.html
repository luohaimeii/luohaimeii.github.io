<!doctype html><html lang="zh-Hans"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>书名解释｜虎思国学网</title><meta name="description" content="《千金方》书名解释"><link rel="canonical" href="https://husir.cn/qianjinfang/1652587265.html"><link rel="stylesheet" href="/site.css?v=20260826g"><link rel="icon" href="/favicon.svg" type="image/svg+xml"><link rel="icon" href="/favicon.ico" sizes="any"><meta name="theme-color" content="#102a43"></head><body><header class="site-header"><a class="brand" href="/" aria-label="虎思国学网首页"><img src="/logo.svg" alt="虎思国学网" width="238" height="54"></a><nav class="main-nav" aria-label="主要栏目"><a href="/">首页</a><a href="/jing/">经</a><a href="/shi/">史</a><a href="/zi/">子</a><a href="/ji/">集</a></nav><nav class="user-nav" aria-label="个人功能"><a href="/bookshelf/">我的书架</a><a href="/account/">登录</a></nav></header><main><div class="reader-shell" data-reader data-work="qianjinfang" data-work-title="千金方" data-title="书名解释"><nav class="breadcrumbs"><a href="/">首页</a><span>›</span><a href="/zi/">子部</a><span>›</span><a href="/qianjinfang/">千金方</a><span>›</span><strong>书名解释</strong></nav><div class="reader-toolbar"><a href="/qianjinfang/">☰ 目录</a><button data-font="-2">字小</button><button data-font="2">字大</button><span class="spacer"></span><button class="favorite-button" data-favorite="qianjinfang" data-title="千金方">☆ 收藏</button></div><article class="reader-paper"><h1>书名解释</h1><div class="reader-content"><p>孙思邈认为生命的价值贵于千金，而一个处方能救人于危殆，价值更当胜于此，因而用《千金要方》作为书名，简称《千金方》，30卷。宋仁宗命高保衡、林亿校正，后列《禁经》二卷。唐代孙思邈撰于永徽三年。</p> <p>作者以人命重于千金，故取千金为书名。是感于当时的方药本草部秩浩繁，仓卒间求检不易，乃博采群经，删繁去复，并结合个人经验而撰成 。</p> </div></article><nav class="reader-nav"><a rel="prev" href="/qianjinfang/1652587263.html">← 内容简介</a><span></span></nav></div></main><footer class="site-footer"><section class="friend-links" aria-labelledby="friend-title"><h2 id="friend-title">友情链接</h2><div id="friend-links-list"><a href="https://husir.cn/">虎思国学网</a></div></section><div class="footer-meta"><span>公益性传统文化阅读网站</span><span>Copyright © 2002–2026 Husir.cn</span><a target="_blank" rel="nofollow noopener" href="https://beian.miit.gov.cn">闽ICP备2022000160号-2</a></div></footer><script src="/app.js?v=20260826g"></script></body></html>
