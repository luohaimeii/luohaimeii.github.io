<!doctype html><html lang="zh-Hans"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>遁甲·闭六戊法｜虎思国学网</title><meta name="description" content="《太白阴经》遁甲·闭六戊法"><link rel="canonical" href="https://husir.cn/taibaiyinjing/1652154089.html"><link rel="stylesheet" href="/site.css?v=20260826g"><link rel="icon" href="/favicon.svg" type="image/svg+xml"><link rel="icon" href="/favicon.ico" sizes="any"><meta name="theme-color" content="#102a43"></head><body><header class="site-header"><a class="brand" href="/" aria-label="虎思国学网首页"><img src="/logo.svg" alt="虎思国学网" width="238" height="54"></a><nav class="main-nav" aria-label="主要栏目"><a href="/">首页</a><a href="/jing/">经</a><a href="/shi/">史</a><a href="/zi/">子</a><a href="/ji/">集</a></nav><nav class="user-nav" aria-label="个人功能"><a href="/bookshelf/">我的书架</a><a href="/account/">登录</a></nav></header><main><div class="reader-shell" data-reader data-work="taibaiyinjing" data-work-title="太白阴经" data-title="遁甲·闭六戊法"><nav class="breadcrumbs"><a href="/">首页</a><span>›</span><a href="/zi/">子部</a><span>›</span><a href="/taibaiyinjing/">太白阴经</a><span>›</span><strong>遁甲·闭六戊法</strong></nav><div class="reader-toolbar"><a href="/taibaiyinjing/">☰ 目录</a><button data-font="-2">字小</button><button data-font="2">字大</button><span class="spacer"></span><button class="favorite-button" data-favorite="taibaiyinjing" data-title="太白阴经">☆ 收藏</button></div><article class="reader-paper"><h1>遁甲·闭六戊法</h1><div class="reader-content"> <p>　　先置营，讫于某旬，上以刀从鬼门行起，左旋画地一周，次取其中央之土一斗，置六戊上。六戊者，天罡神也。刀即置取土之处，埋之咒曰：「太山之阳，恒山之阴。盗贼不起，虎狼不伤，城郭不完，闭以金关，千凶万恶，莫之敢犯，便于营中宿。若令出入，验之法取犊母在营，子安营外，犊子终不敢入营中，甲子旬戊在辰，余仿此。</p> </div></article><nav class="reader-nav"><a rel="prev" href="/taibaiyinjing/1652154100.html">← 遁甲·出师安营</a><a rel="next" href="/taibaiyinjing/1652154079.html">遁甲·玉女闭局法 →</a></nav></div></main><footer class="site-footer"><section class="friend-links" aria-labelledby="friend-title"><h2 id="friend-title">友情链接</h2><div id="friend-links-li
