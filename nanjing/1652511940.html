<!doctype html><html lang="zh-Hans"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>论针法·七十九难｜虎思国学网</title><meta name="description" content="《难经》论针法·七十九难"><link rel="canonical" href="https://husir.cn/nanjing/1652511940.html"><link rel="stylesheet" href="/site.css?v=20260826g"><link rel="icon" href="/favicon.svg" type="image/svg+xml"><link rel="icon" href="/favicon.ico" sizes="any"><meta name="theme-color" content="#102a43"></head><body><header class="site-header"><a class="brand" href="/" aria-label="虎思国学网首页"><img src="/logo.svg" alt="虎思国学网" width="238" height="54"></a><nav class="main-nav" aria-label="主要栏目"><a href="/">首页</a><a href="/jing/">经</a><a href="/shi/">史</a><a href="/zi/">子</a><a href="/ji/">集</a></nav><nav class="user-nav" aria-label="个人功能"><a href="/bookshelf/">我的书架</a><a href="/account/">登录</a></nav></header><main><div class="reader-shell" data-reader data-work="nanjing" data-work-title="难经" data-title="论针法·七十九难"><nav class="breadcrumbs"><a href="/">首页</a><span>›</span><a href="/zi/">子部</a><span>›</span><a href="/nanjing/">难经</a><span>›</span><strong>论针法·七十九难</strong></nav><div class="reader-toolbar"><a href="/nanjing/">☰ 目录</a><button data-font="-2">字小</button><button data-font="2">字大</button><span class="spacer"></span><button class="favorite-button" data-favorite="nanjing" data-title="难经">☆ 收藏</button></div><article class="reader-paper"><h1>论针法·七十九难</h1><div class="reader-content"> <p>　　曰：经言，迎而夺之，安得无虚？随而济之，安得无实，虚之与实，若得若失；实之与虚，若有若无，何谓也？</p> <p>　　然：迎而夺之者，泻其子也；随而济之者，补其母也。假令心病，泻手心主俞，是谓迎而夺之者也；补手心主井，是谓随而济之者也。所谓实之与虚者，牢濡之意也。气来实牢者为得，濡虚者为失，故曰若得若失也。</p> </div></article><nav class="reader-nav"><a rel="prev" href="/nanjing/1652511950.html">← 论针法·七十八难</a><a rel="next" href="/nanjing/1652511929.html">论针法·八十难 →</a></nav></div></main><footer class="site-footer"><section class="friend-links" aria-labelledby="friend-title"><h2 id="friend-title">友情链接</h2><div id="friend-links-list"><a href="https://husir.cn/">虎思国学网</
