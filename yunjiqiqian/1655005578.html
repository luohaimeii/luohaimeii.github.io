<!doctype html><html lang="zh-Hans"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>题解｜虎思国学网</title><meta name="description" content="《云笈七签》题解"><link rel="canonical" href="https://husir.cn/yunjiqiqian/1655005578.html"><link rel="stylesheet" href="/site.css?v=20260826g"><link rel="icon" href="/favicon.svg" type="image/svg+xml"><link rel="icon" href="/favicon.ico" sizes="any"><meta name="theme-color" content="#102a43"></head><body><header class="site-header"><a class="brand" href="/" aria-label="虎思国学网首页"><img src="/logo.svg" alt="虎思国学网" width="238" height="54"></a><nav class="main-nav" aria-label="主要栏目"><a href="/">首页</a><a href="/jing/">经</a><a href="/shi/">史</a><a href="/zi/">子</a><a href="/ji/">集</a></nav><nav class="user-nav" aria-label="个人功能"><a href="/bookshelf/">我的书架</a><a href="/account/">登录</a></nav></header><main><div class="reader-shell" data-reader data-work="yunjiqiqian" data-work-title="云笈七签" data-title="题解"><nav class="breadcrumbs"><a href="/">首页</a><span>›</span><a href="/zi/">子部</a><span>›</span><a href="/yunjiqiqian/">云笈七签</a><span>›</span><strong>题解</strong></nav><div class="reader-toolbar"><a href="/yunjiqiqian/">☰ 目录</a><button data-font="-2">字小</button><button data-font="2">字大</button><span class="spacer"></span><button class="favorite-button" data-favorite="yunjiqiqian" data-title="云笈七签">☆ 收藏</button></div><article class="reader-paper"><h1>题解</h1><div class="reader-content"><p>道教称藏书之容器曰云笈，分道书为三洞四辅七部，故张君房在该书的序言中有掇云笈七部之英，略宝蕴诸子之奥等语，因名《云笈七签》；并称编纂此书的目的是上以酬真宗皇帝委遇之恩，次以备皇帝陛下乙夜之览，下以裨文馆校雠之职，外此而少畅玄风耳。</p> </div></article><nav class="reader-nav"><a rel="prev" href="/yunjiqiqian/1655005576.html">← 分卷</a><span></span></nav></div></main><footer class="site-footer"><section class="friend-links" aria-labelledby="friend-title"><h2 id="friend-title">友情链接</h2><div id="friend-links-list"><a href="https://husir.cn/">虎思国学网</a></div></section><div class="footer-meta"><span>公益性传统文化阅读网站</span><span>Copyright © 2002–20
