<!doctype html><html lang="zh-Hans"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>第一六Ｏ则｜虎思国学网</title><meta name="description" content="《围炉夜话》第一六Ｏ则"><link rel="canonical" href="https://husir.cn/weiluyehua/1651554928.html"><link rel="stylesheet" href="/site.css?v=20260826g"><link rel="icon" href="/favicon.svg" type="image/svg+xml"><link rel="icon" href="/favicon.ico" sizes="any"><meta name="theme-color" content="#102a43"></head><body><header class="site-header"><a class="brand" href="/" aria-label="虎思国学网首页"><img src="/logo.svg" alt="虎思国学网" width="238" height="54"></a><nav class="main-nav" aria-label="主要栏目"><a href="/">首页</a><a href="/jing/">经</a><a href="/shi/">史</a><a href="/zi/">子</a><a href="/ji/">集</a></nav><nav class="user-nav" aria-label="个人功能"><a href="/bookshelf/">我的书架</a><a href="/account/">登录</a></nav></header><main><div class="reader-shell" data-reader data-work="weiluyehua" data-work-title="围炉夜话" data-title="第一六Ｏ则"><nav class="breadcrumbs"><a href="/">首页</a><span>›</span><a href="/zi/">子部</a><span>›</span><a href="/weiluyehua/">围炉夜话</a><span>›</span><strong>第一六Ｏ则</strong></nav><div class="reader-toolbar"><a href="/weiluyehua/">☰ 目录</a><button data-font="-2">字小</button><button data-font="2">字大</button><span class="spacer"></span><button class="favorite-button" data-favorite="weiluyehua" data-title="围炉夜话">☆ 收藏</button></div><article class="reader-paper"><h1>第一六Ｏ则</h1><div class="reader-content"> <p>　　有守虽无所展布，而其节不挠，故与有猷有为而并重；立言即未经起行，而于人有益，故与立功立德而并传。<br><span style="color:#af9100;">　　能谨守道义而不变节，虽然对道义并无推展之功，却有守节不屈之志，所以和有贡献有作为是同等重要的。在文字上宣扬道理，虽然并未以行为动来加以表现，但是已使闻而信者得到裨益，因此和直接建立事业与功德是同样不朽而为人所传颂的。</span></p> </div></article><nav class="reader-nav"><a rel="prev" href="/weiluyehua/1651554937.html">← 第一五九则</a><a rel="next" href="/weiluyehua/1651554918.html">第一六一则 →</a></nav></div></main><footer class="site-footer"><section class="friend-links" aria-labelledby="friend-title"><h2 id="friend-title">友情链接</h2><div id="f
