<!doctype html><html lang="zh-Hans"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>卷六 君人｜虎思国学网</title><meta name="description" content="《慎子》君人"><link rel="canonical" href="https://husir.cn/shenzi/1652326941.html"><link rel="stylesheet" href="/site.css?v=20260826g"><link rel="icon" href="/favicon.svg" type="image/svg+xml"><link rel="icon" href="/favicon.ico" sizes="any"><meta name="theme-color" content="#102a43"></head><body><header class="site-header"><a class="brand" href="/" aria-label="虎思国学网首页"><img src="/logo.svg" alt="虎思国学网" width="238" height="54"></a><nav class="main-nav" aria-label="主要栏目"><a href="/">首页</a><a href="/jing/">经</a><a href="/shi/">史</a><a href="/zi/">子</a><a href="/ji/">集</a></nav><nav class="user-nav" aria-label="个人功能"><a href="/bookshelf/">我的书架</a><a href="/account/">登录</a></nav></header><main><div class="reader-shell" data-reader data-work="shenzi" data-work-title="慎子" data-title="卷六 君人"><nav class="breadcrumbs"><a href="/">首页</a><span>›</span><a href="/zi/">子部</a><span>›</span><a href="/shenzi/">慎子</a><span>›</span><strong>卷六 君人</strong></nav><div class="reader-toolbar"><a href="/shenzi/">☰ 目录</a><button data-font="-2">字小</button><button data-font="2">字大</button><span class="spacer"></span><button class="favorite-button" data-favorite="shenzi" data-title="慎子">☆ 收藏</button></div><article class="reader-paper"><h1>卷六 君人</h1><div class="reader-content"> <p>　　君人者，舍法而以身治，则诛赏予夺，从君心出矣。然则受赏者虽当，望多无穷；受罚者虽当，望轻无已。君舍法，而以心裁轻重，则同功殊赏，同罪殊罚矣，怨之所由生也。是以分马者之用策，分田者之用钩，非以策、钩为过于人智也，所以去私塞怨也。故曰：大君任法而弗躬，则事断于法矣。法之所加，各以其分，蒙其赏罚而无望于君也，是以怨不生而上下和矣。</p> </div></article><nav class="reader-nav"><a rel="prev" href="/shenzi/1652326952.html">← 卷五 德立</a><a rel="next" href="/shenzi/1652326930.html">卷七 君臣 →</a></nav></div></main><footer class="site-footer"><section class="friend-links" aria-labelledby="friend-title"><h2 id="friend-title">友情链接</h2><div id="friend-links-list"><a href="https://husir.cn/">虎思国学网</a></div></section><di
