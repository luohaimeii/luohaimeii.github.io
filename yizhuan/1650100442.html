<!doctype html><html lang="zh-Hans"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>彖传下·中孚｜虎思国学网</title><meta name="description" content="《易传》彖传下·中孚"><link rel="canonical" href="https://husir.cn/yizhuan/1650100442.html"><link rel="stylesheet" href="/site.css?v=20260826g"><link rel="icon" href="/favicon.svg" type="image/svg+xml"><link rel="icon" href="/favicon.ico" sizes="any"><meta name="theme-color" content="#102a43"></head><body><header class="site-header"><a class="brand" href="/" aria-label="虎思国学网首页"><img src="/logo.svg" alt="虎思国学网" width="238" height="54"></a><nav class="main-nav" aria-label="主要栏目"><a href="/">首页</a><a href="/jing/">经</a><a href="/shi/">史</a><a href="/zi/">子</a><a href="/ji/">集</a></nav><nav class="user-nav" aria-label="个人功能"><a href="/bookshelf/">我的书架</a><a href="/account/">登录</a></nav></header><main><div class="reader-shell" data-reader data-work="yizhuan" data-work-title="易传" data-title="彖传下·中孚"><nav class="breadcrumbs"><a href="/">首页</a><span>›</span><a href="/jing/">经部</a><span>›</span><a href="/yizhuan/">易传</a><span>›</span><strong>彖传下·中孚</strong></nav><div class="reader-toolbar"><a href="/yizhuan/">☰ 目录</a><button data-font="-2">字小</button><button data-font="2">字大</button><span class="spacer"></span><button class="favorite-button" data-favorite="yizhuan" data-title="易传">☆ 收藏</button></div><article class="reader-paper"><h1>彖传下·中孚</h1><div class="reader-content"> <p>　　中孚，柔在内而刚得中，说而巽，孚乃化邦也。豚鱼吉，信及豚鱼也。利涉大川，乘木舟虚也。中孚以利贞，乃应乎天也。<br><span style="color:#af9100;">　　中孚，（六三、六四）阴柔在内而（九二、九五）阳刚居中，喜悦而逊顺，其诚才能感化邦国。“用猪和鱼（祭祀）吉”，诚信得之于用猪和鱼（祭祀）。“宜于涉越大河”，乘驾木舟中虚（行水）。中孚能“宜于守正”，才是顺应天道。</span></p> </div></article><nav class="reader-nav"><a rel="prev" href="/yizhuan/1650100451.html">← 彖传下·节</a><a rel="next" href="/yizhuan/1650100432.html">彖传下·小过 →</a></nav></div></main><footer class="site-footer"><section class="friend-links" aria-labelledby="friend-title"><h2 id="friend-title">友情链接</h2><div id="friend-links-list">
