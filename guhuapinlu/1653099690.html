<!doctype html><html lang="zh-Hans"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>序文｜虎思国学网</title><meta name="description" content="《古画品录》序文"><link rel="canonical" href="https://husir.cn/guhuapinlu/1653099690.html"><link rel="stylesheet" href="/site.css?v=20260826g"><link rel="icon" href="/favicon.svg" type="image/svg+xml"><link rel="icon" href="/favicon.ico" sizes="any"><meta name="theme-color" content="#102a43"></head><body><header class="site-header"><a class="brand" href="/" aria-label="虎思国学网首页"><img src="/logo.svg" alt="虎思国学网" width="238" height="54"></a><nav class="main-nav" aria-label="主要栏目"><a href="/">首页</a><a href="/jing/">经</a><a href="/shi/">史</a><a href="/zi/">子</a><a href="/ji/">集</a></nav><nav class="user-nav" aria-label="个人功能"><a href="/bookshelf/">我的书架</a><a href="/account/">登录</a></nav></header><main><div class="reader-shell" data-reader data-work="guhuapinlu" data-work-title="古画品录" data-title="序文"><nav class="breadcrumbs"><a href="/">首页</a><span>›</span><a href="/zi/">子部</a><span>›</span><a href="/guhuapinlu/">古画品录</a><span>›</span><strong>序文</strong></nav><div class="reader-toolbar"><a href="/guhuapinlu/">☰ 目录</a><button data-font="-2">字小</button><button data-font="2">字大</button><span class="spacer"></span><button class="favorite-button" data-favorite="guhuapinlu" data-title="古画品录">☆ 收藏</button></div><article class="reader-paper"><h1>序文</h1><div class="reader-content"> <p>　　夫画品者，盖众画之优劣也。图绘者，莫不明劝戒、著升沉，千载寂寥，披图可鉴。虽画有六法，罕能尽该。而自古及今，各善一节。六法者何？一，气韵生动是也；二，骨法用笔是也；三，应物象形是也；四，随类赋彩是也；五，经营位置是也；六，传移模写是也。唯陆探微、卫协备该之矣。然迹有巧拙，艺无古今，谨依远近，随其品第，裁成序引。故此所述不广其源，但传出自神仙，莫之闻见也。</p> </div></article><nav class="reader-nav"><span></span><a rel="next" href="/guhuapinlu/1653099679.html">第一品 →</a></nav></div></main><footer class="site-footer"><section class="friend-links" aria-labelledby="friend-title"><h2 id="friend-title">友情链接</h2><div id="friend-links-list"><a href="https://husir.cn/">虎思国学网</a></div></section><div class="f
