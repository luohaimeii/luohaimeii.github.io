<!doctype html><html lang="zh-Hans"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>卷五十五 草部·白鲜｜虎思国学网</title><meta name="description" content="《本草纲目》草部·白鲜"><link rel="canonical" href="https://husir.cn/bencaogangmu/1652501629.html"><link rel="stylesheet" href="/site.css?v=20260826g"><link rel="icon" href="/favicon.svg" type="image/svg+xml"><link rel="icon" href="/favicon.ico" sizes="any"><meta name="theme-color" content="#102a43"></head><body><header class="site-header"><a class="brand" href="/" aria-label="虎思国学网首页"><img src="/logo.svg" alt="虎思国学网" width="238" height="54"></a><nav class="main-nav" aria-label="主要栏目"><a href="/">首页</a><a href="/jing/">经</a><a href="/shi/">史</a><a href="/zi/">子</a><a href="/ji/">集</a></nav><nav class="user-nav" aria-label="个人功能"><a href="/bookshelf/">我的书架</a><a href="/account/">登录</a></nav></header><main><div class="reader-shell" data-reader data-work="bencaogangmu" data-work-title="本草纲目" data-title="卷五十五 草部·白鲜"><nav class="breadcrumbs"><a href="/">首页</a><span>›</span><a href="/zi/">子部</a><span>›</span><a href="/bencaogangmu/">本草纲目</a><span>›</span><strong>卷五十五 草部·白鲜</strong></nav><div class="reader-toolbar"><a href="/bencaogangmu/">☰ 目录</a><button data-font="-2">字小</button><button data-font="2">字大</button><span class="spacer"></span><button class="favorite-button" data-favorite="bencaogangmu" data-title="本草纲目">☆ 收藏</button></div><article class="reader-paper"><h1>卷五十五 草部·白鲜</h1><div class="reader-content"> <p><strong>释名</strong><br>鲜，音仙。亦名白 、白羊鲜、金雀儿椒。</p> <p><strong>气味</strong><br>(根皮)苦、寒、无毒。</p> <p><strong>主治</strong><br>头风、黄疸、咳逆、风疮、疥癣、赤烂等症。<br>产后中风，但体虚不能服他药的病人，可用白癣皮加新汲水三升煮成一升，温服。李明珍指出:白鲜是治各种黄疸病和风痹的要药，但许多医生只用之于疮科，这是不够的。</p> </div></article><nav class="reader-nav"><a rel="prev" href="/bencaogangmu/1652501639.html">← 卷五十四 草部·苦参</a><a rel="next" href="/bencaogangmu/1652501618.html">卷五十六 草部·山慈姑 →</a></nav></div></main><footer class="site-footer"><section class="friend-links" aria-labelle
